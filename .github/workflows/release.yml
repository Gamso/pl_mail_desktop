name: Release

# Push a tag such as v0.2.0 to build the Windows installer, sign it for the in-app updater, and
# attach both, plus a portable exe, to a draft GitHub release.
#
# The tag must equal the version in src-tauri/tauri.conf.json, and CHANGELOG.md must have a
# "## [x.y.z]" section for it: that section becomes the release notes, and the same text is what
# the updater shows to users. A tag with a dash (v0.2.0-beta.1) is published as a pre-release,
# which the updater never offers.
#
# Repository secrets needed: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# Optional, to sign the installer and the exe (Authenticode, Azure Artifact Signing; README, "Code
# signing"): secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID and variables
# AZURE_ARTIFACT_SIGNING_ENDPOINT, AZURE_ARTIFACT_SIGNING_ACCOUNT,
# AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE. Without all six, the release is built unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag, the version and the signing key agree
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "The tag is $env:TAG but src-tauri/tauri.conf.json says $version. Bump the version (tauri.conf.json, Cargo.toml, package.json), then tag again."
          }
          if ([string]::IsNullOrEmpty($env:SIGNING_KEY)) {
            throw "The TAURI_SIGNING_PRIVATE_KEY secret is missing: the updater could not verify this release."
          }

      # Authenticode signing with Azure Artifact Signing, when it is set up (see README, "Code
      # signing"). Without it the build goes on unsigned, as before. Tauri runs the sign command on
      # the executable and on the installer before it signs the installer for the updater, so the
      # updater signature covers the Authenticode-signed file.
      - name: Decide whether to sign the executables
        id: sign
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $needed = @($env:AZURE_CLIENT_ID, $env:AZURE_CLIENT_SECRET, $env:AZURE_TENANT_ID, $env:ENDPOINT, $env:ACCOUNT, $env:PROFILE)
          if ($needed | Where-Object { [string]::IsNullOrEmpty($_) }) {
            Write-Host "::notice::Code signing is not set up: the installer and the exe are not signed."
            "enabled=false" >> $env:GITHUB_OUTPUT
            "args=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $config = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = "artifact-signing-cli"
            args = @("-e", $env:ENDPOINT, "-d", "plMail Desktop", "%1")
          } } } }
          $path = Join-Path $env:RUNNER_TEMP "tauri.signing.conf.json"
          $config | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM $path
          "enabled=true" >> $env:GITHUB_OUTPUT
          # The runner's temp path has no spaces, and tauri-action splits `args` on them.
          "args=--config $path" >> $env:GITHUB_OUTPUT

      - name: Install the signing tool
        if: steps.sign.outputs.enabled == 'true'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked

      - name: Take the release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.sign.outputs.enabled }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          if ($changelog -match $pattern) {
            $notes = $Matches[1].Trim()
          } elseif ($version.Contains('-')) {
            $notes = "Pre-release $version. It is not offered by the in-app updater."
          } else {
            throw "CHANGELOG.md has no '## [$version]' section."
          }
          if ($env:SIGNED -eq 'true') {
            $smartscreen = "The installer and the exe are code-signed. While the certificate is new, Windows SmartScreen may still warn you the first time (More info, then Run anyway)."
          } else {
            $smartscreen = "The installer is not code-signed, so Windows SmartScreen may warn you the first time (More info, then Run anyway)."
          }
          $notes += "`n`n### Install`nDownload **plMail Desktop_${version}_x64-setup.exe** and run it: it installs for the current user, with no administrator rights. An existing installation is updated in place, keeping its shortcuts. $smartscreen`n`nThe **portable** exe needs no installation, but does not update itself.`n"
          $delimiter = "EOF_" + [guid]::NewGuid().ToString("N")
          $text = "notes<<$delimiter`n$notes`n$delimiter`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $text, (New-Object System.Text.UTF8Encoding $false))

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Run the tests before building anything to ship
        working-directory: src-tauri
        run: |
          npm --prefix .. run build
          cargo test

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by artifact-signing-cli when code signing is set up; empty otherwise.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: plMail Desktop ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The updater reads latest.json; point it at the NSIS installer, the only bundle built.
          updaterJsonPreferNsis: true
          args: --bundles nsis ${{ steps.sign.outputs.args }}

      - name: Check the installer's signature
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) ($($signature.SignerCertificate.Subject))"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed." }
          }

      - name: Attach the portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.sign.outputs.enabled }}
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "plMail-Desktop_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/plmail-client.exe $name
          # Tauri puts the unsigned binary back in target/release after bundling: sign this copy.
          if ($env:SIGNED -eq 'true') {
            artifact-signing-cli -e $env:ENDPOINT -d "plMail Desktop" $name
            if ($LASTEXITCODE -ne 0) { throw "Signing the portable exe failed." }
            $signature = Get-AuthenticodeSignature (Resolve-Path $name)
            Write-Host "${name}: $($signature.Status)"
            if ($signature.Status -ne 'Valid') { throw "$name is not validly signed." }
          }
          gh api --method POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$name" -H "Content-Type: application/octet-stream" --input $name
