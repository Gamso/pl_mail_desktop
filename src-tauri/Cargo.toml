[package]
name = "plmail-client"
version = "0.1.0"
description = "Windows desktop client for pl_mail"
authors = ["Gamso"]
repository = "https://github.com/Gamso/pl_mail_desktop"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plmail_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ab_glyph = "0.2"
sys-locale = "0.3"
percent-encoding = "2"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
webview2-com = "0.39"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
